name: Template checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: template-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Typst 0.15.1 and Poppler
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes poppler-utils
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/typst.tar.xz" \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version
      - name: Verify bundled fonts
        working-directory: fonts
        run: sha256sum --check SHA256SUMS
      - name: Run isolated template and personalization tests
        run: make test
      - name: Build both public examples without system fonts
        run: |
          make TYPST_FLAGS=--ignore-system-fonts
          make en TYPST_FLAGS=--ignore-system-fonts
